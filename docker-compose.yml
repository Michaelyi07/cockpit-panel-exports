version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: dash_exports_1855
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}@db:5432/dash_exports_1855
      STORAGE_DIR: /data/storage
      LINK_SECRET: ${LINK_SECRET:?must set LINK_SECRET before docker compose up}
      LINK_TTL_SECONDS: "86400"
      WORKER_ENABLED: "true"
    ports:
      - "8801:8801"
    volumes:
      - export-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  export-storage:
